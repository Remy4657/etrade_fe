name: CI-CD

on:
  push:
    branches: ["deploy"]
  workflow_dispatch:
jobs:
  github-ci-remy4657:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: login docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -f Dockerfile.pro \
          -t remy4657/test-etrade-fe-ci:${{ github.sha }} \
          -t remy4657/test-etrade-fe-ci:latest .

      - name: Push Image
        run: |
          docker push remy4657/test-etrade-fe-ci:${{ github.sha }}
          docker push remy4657/test-etrade-fe-ci:latest
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/project/etrade/fe
            docker compose pull
            docker compose down
            docker compose up -d
